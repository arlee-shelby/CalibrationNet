[project]
name = "calibrationnet"
version = "0.1.0"
description = "Detector calibration database for run/pixel energy calibrations"
requires-python = ">=3.9"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["calibrationnet*"]

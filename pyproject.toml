[project]
name = "calibrationnet"
version = "0.1.0"
description = "Detector calibration database for run/pixel energy calibrations"
requires-python = ">=3.9"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "python-dotenv>=1.0",
    # Analysis layer: hit maps (matplotlib), spectrum fitting (lmfit/scipy).
    # Unpinned on purpose so installing into an existing nabPy environment
    # never fights its numpy/numba pins.
    "numpy",
    "scipy",
    "matplotlib",
    "lmfit",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["calibrationnet*"]
